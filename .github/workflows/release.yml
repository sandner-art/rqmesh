# Publishes to PyPI with trusted publishing (no API token). One-time setup on pypi.org: Account settings >
# Publishing > Add a pending publisher (owner sandner-art, repo rqmesh, workflow release.yml, environment pypi).
name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - name: check the tag matches the version
        run: |
          V=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject version $V"; exit 1; }
      - name: test
        run: pip install -e .[test,scipy] && python -m pytest -q
      - name: build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v6
        with: { name: dist, path: dist/ }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist/ }
      - uses: softprops/action-gh-release@v2
        with: { files: 'dist/*', generate_release_notes: true }
